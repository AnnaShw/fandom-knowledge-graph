# field_aliases: global mapping of relationship type → all field names any wiki might use.
# Applied to every universe automatically — no per-universe field config needed.
# Add new aliases here when a new wiki uses an unexpected field name.
field_aliases:
  FAMILY_OF:          [family, parentage, relatives, kin]
  PARENT_OF:          [parents, children, offspring, sons, daughters]
  SIBLING_OF:         [siblings, brothers, sisters]
  MARRIED_TO:         [spouse, spouses, wife, husband, consort]
  ROMANTIC_WITH:      [romances, romance, partner, lover]
  MEMBER_OF:          [affiliation, affiliations, house, culture, loyalty, allegiance, realms, faction, organization]
  BELONGS_TO_SPECIES: [species, race]
  FRIEND_OF:          [friends, allies, ally, companions]
  ENEMY_OF:           [enemies, rivals, rival, nemesis]

# Add a new universe by adding a new top-level key (besides field_aliases).
# character_template: fetch pages that embed this infobox template (more precise).
# character_category: fetch pages in this wiki category (fallback).

harrypotter:
  name: "Harry Potter"
  api_url: "https://harrypotter.fandom.com/api.php"
  character_template: "Individual infobox"

lotr:
  name: "Lord of the Rings"
  api_url: "https://lotr.fandom.com/api.php"
  character_category: "The Lord of the Rings characters"

dune:
  name: "Dune"
  api_url: "https://dune.fandom.com/api.php"
  character_category: "Characters"

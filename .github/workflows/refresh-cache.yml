name: Refresh graph cache

on:
  schedule:
    - cron: '0 3 * * 1'   # Every Monday at 03:00 UTC
  workflow_dispatch:        # Allow manual trigger from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Needed to push the updated cache files

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest all universes (cache-only, no Neo4j needed)
        run: python flows/ingest.py all 300 --cache-only

      - name: Commit updated cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh graph cache [skip ci]"
            git push
          else
            echo "Cache unchanged, nothing to commit."
          fi

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fandom Knowledge Graph</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.0/cytoscape.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lora', Georgia, serif;
      background: #0e0b07;
      color: #e8d5a3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Controls bar ── */
    #controls {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 9px 20px;
      background: #160f05;
      border-bottom: 1px solid #3d2e14;
      flex-shrink: 0;
    }

    #controls h1 {
      font-size: 1.2rem;
      font-weight: 600;
      font-style: italic;
      color: #c9a84c;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    /* thin ornamental divider after the title */
    #controls h1::after {
      content: '·';
      margin-left: 14px;
      color: #3d2e14;
      font-style: normal;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.85rem;
      color: #7a6030;
      white-space: nowrap;
    }

    select, input[type="text"] {
      background: #1e1508;
      color: #e8d5a3;
      border: 1px solid #3d2e14;
      border-radius: 3px;
      padding: 4px 10px;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
    }

    select:focus, input[type="text"]:focus { outline: 1px solid #c9a84c; }

    input[type="range"] {
      width: 110px;
      accent-color: #c9a84c;
      cursor: pointer;
    }

    #node-count-label {
      font-size: 0.85rem;
      color: #7a6030;
      min-width: 52px;
    }

    #search-input { width: 160px; }
    #search-input::placeholder { color: #3d2e14; }

    button#load-btn {
      background: #1e1508;
      color: #c9a84c;
      border: 1px solid #5a4020;
      border-radius: 3px;
      padding: 4px 18px;
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }
    button#load-btn:hover  { border-color: #c9a84c; background: #251a08; }
    button#load-btn:active { background: #160f05; }

    #status {
      margin-left: auto;
      font-size: 0.8rem;
      color: #5a4020;
      white-space: nowrap;
      font-style: italic;
    }

    /* ── Main canvas area ── */
    #main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #cy { width: 100%; height: 100%; background: #080502; }

    /* ── Loading overlay ── */
    #loading {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(8, 5, 2, 0.86);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
    }
    #loading.visible { display: flex; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #3d2e14;
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading span { font-size: 1rem; color: #7a6030; font-style: italic; }

    /* ── Info panel ── */
    #info {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 255px;
      max-height: calc(100% - 28px);
      background: #160f05;
      border: 1px solid #3d2e14;
      border-radius: 4px;
      padding: 14px 16px;
      font-size: 0.9rem;
      line-height: 1.65;
      display: none;
      z-index: 10;
      overflow-y: auto;
    }
    #info.visible { display: block; }

    #info-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #3d2e14;
    }

    #info h2 {
      font-size: 1.05rem;
      color: #c9a84c;
      line-height: 1.3;
      font-style: italic;
    }

    #info-close {
      cursor: pointer;
      color: #3d2e14;
      font-size: 1rem;
      line-height: 1;
      flex-shrink: 0;
      margin-left: 8px;
    }
    #info-close:hover { color: #c9a84c; }

    .rel-badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 2px;
      font-size: 0.78rem;
      font-weight: 600;
      font-style: normal;
    }

    .rel-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
      flex-wrap: wrap;
    }

    /* ── Empty state ── */
    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }
    #empty-state p {
      font-size: 1.05rem;
      font-style: italic;
      color: #3d2e14;
      border: 1px dashed #3d2e14;
      padding: 18px 32px;
      border-radius: 4px;
    }
    #empty-state.hidden { display: none; }

    /* ── Legend ── */
    #legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(22, 15, 5, 0.95);
      border: 1px solid #3d2e14;
      border-radius: 4px;
      padding: 7px 12px;
      font-size: 0.78rem;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      max-width: 620px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 3px;
      border: 1px solid transparent;
      transition: background 0.15s, opacity 0.15s, border-color 0.15s;
      user-select: none;
    }
    .legend-item:hover { background: rgba(201,168,76,0.08); }
    .legend-item.active {
      background: rgba(201,168,76,0.12);
      border-color: var(--rel-color);
    }
    .legend-item.inactive { opacity: 0.28; }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div id="controls">
  <h1>Fandom Knowledge Graph</h1>

  <div class="control-group">
    <label for="universe-select">Universe</label>
    <select id="universe-select"></select>
  </div>

  <div class="control-group">
    <label for="max-nodes">Max nodes</label>
    <input type="range" id="max-nodes" min="20" max="500" value="200" step="10">
    <span id="node-count-label">200</span>
  </div>

  <div class="control-group">
    <input type="text" id="search-input" placeholder="Search character…">
  </div>

  <button id="load-btn">Load</button>

  <span id="status"></span>
</div>

<div id="main">
  <div id="empty-state">
    <p>Select a universe from the dropdown above to visualize the graph.</p>
  </div>
  <div id="cy"></div>

  <div id="loading">
    <div class="spinner"></div>
    <span>Building graph…</span>
  </div>

  <div id="info">
    <div id="info-header">
      <h2 id="info-title"></h2>
      <span id="info-close">✕</span>
    </div>
    <div id="info-body"></div>
  </div>

  <div id="legend"></div>
</div>

<script>
  const COMMUNITY_COLORS = [
    '#d95f5f','#5f8fd9','#5fd97a','#d9a85f',
    '#9f5fd9','#5fd4d9','#d97a5f','#5fd9c0',
    '#d95fb4','#b4d95f',
  ];

  const EDGE_COLORS = {
    FAMILY_OF:          '#e67e22',
    PARENT_OF:          '#e74c3c',
    SIBLING_OF:         '#f39c12',
    ROMANTIC_WITH:      '#e91e63',
    MARRIED_TO:         '#e91e63',
    FRIEND_OF:          '#2ecc71',
    ENEMY_OF:           '#9b59b6',
    MEMBER_OF:          '#3498db',
    BELONGS_TO_SPECIES: '#1abc9c',
    BELONGS_TO_RACE:    '#1abc9c',
    FROM_HOMEWORLD:     '#00bcd4',
  };

  const universeSelect = document.getElementById('universe-select');
  const maxNodesSlider = document.getElementById('max-nodes');
  const nodeCountLabel = document.getElementById('node-count-label');
  const searchInput    = document.getElementById('search-input');
  const loadBtn        = document.getElementById('load-btn');
  const statusEl       = document.getElementById('status');
  const loadingEl      = document.getElementById('loading');
  const infoEl         = document.getElementById('info');
  const infoTitleEl    = document.getElementById('info-title');
  const infoBodyEl     = document.getElementById('info-body');
  const legendEl       = document.getElementById('legend');

  let cy = null;
  let currentUniverse = null;

  maxNodesSlider.addEventListener('input', () => {
    nodeCountLabel.textContent = maxNodesSlider.value;
  });

  document.getElementById('info-close').addEventListener('click', clearHighlight);

  function clearHighlight() {
    infoEl.classList.remove('visible');
    if (cy) cy.elements().removeClass('highlighted dimmed path-node path-edge');
  }

  // ── Populate universe dropdown ──
  async function loadUniverses() {
    const res  = await fetch('/api/universes');
    const list = await res.json();

    // placeholder option
    const placeholder = document.createElement('option');
    placeholder.value    = '';
    placeholder.disabled = true;
    placeholder.selected = true;
    placeholder.textContent = 'Choose a universe…';
    universeSelect.appendChild(placeholder);

    list.forEach(u => {
      const opt = document.createElement('option');
      opt.value       = u.id;
      opt.textContent = u.name;
      universeSelect.appendChild(opt);
    });
  }

  // ── Build legend: edge types + community groups ──
  let activeRelFilter      = null;
  let activeCommunityFilter = null;

  function buildLegend(nodes, edges) {
    legendEl.innerHTML = '';
    activeRelFilter       = null;
    activeCommunityFilter = null;

    // Edge-type items
    const seenRel = new Set();
    edges.forEach(e => {
      const t = e.data.rel_type;
      if (!t || seenRel.has(t)) return;
      seenRel.add(t);
      const color = EDGE_COLORS[t] || '#888';
      const label = t.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const item  = document.createElement('div');
      item.className   = 'legend-item';
      item.dataset.rel = t;
      item.style.setProperty('--rel-color', color);
      item.innerHTML   = `<div class="legend-dot" style="background:${color}"></div><span>${label}</span>`;
      item.addEventListener('click', () => toggleRelFilter(t));
      legendEl.appendChild(item);
    });

    // Separator
    const sep = document.createElement('div');
    sep.style.cssText = 'width:1px;background:#3d2e14;margin:2px 4px;align-self:stretch;flex-shrink:0';
    legendEl.appendChild(sep);

    // Community group items
    const seenComm = new Map();
    nodes.forEach(n => {
      const c = n.data.community;
      if (c !== undefined && !seenComm.has(c)) seenComm.set(c, n.data.communityColor);
    });
    seenComm.forEach((color, comm) => {
      // Find the community name from any node in this community
      const rep  = nodes.find(n => n.data.community === comm);
      const name = rep ? rep.data.communityName : `Group ${comm + 1}`;
      const item = document.createElement('div');
      item.className         = 'legend-item';
      item.dataset.community = comm;
      item.style.setProperty('--rel-color', color);
      item.innerHTML = `<div class="legend-dot" style="background:${color}"></div><span>${name}</span>`;
      item.addEventListener('click', () => toggleCommunityFilter(comm));
      legendEl.appendChild(item);
    });
  }

  function toggleCommunityFilter(community) {
    if (!cy) return;
    if (activeCommunityFilter === community) {
      activeCommunityFilter = null;
      cy.elements().removeClass('type-hidden');
      legendEl.querySelectorAll('[data-community]').forEach(el => el.classList.remove('active', 'inactive'));
      return;
    }
    activeCommunityFilter = community;
    const visibleNodes = cy.nodes().filter(n => n.data('community') === community);
    const visibleEdges = visibleNodes.edgesWith(visibleNodes);
    cy.edges().addClass('type-hidden');
    cy.nodes().addClass('type-hidden');
    visibleEdges.removeClass('type-hidden');
    visibleNodes.removeClass('type-hidden');
    legendEl.querySelectorAll('[data-community]').forEach(el => {
      if (parseInt(el.dataset.community) === community) {
        el.classList.add('active'); el.classList.remove('inactive');
      } else {
        el.classList.add('inactive'); el.classList.remove('active');
      }
    });
  }

  function toggleRelFilter(relType) {
    if (!cy) return;

    if (activeRelFilter === relType) {
      // Clear filter
      activeRelFilter = null;
      cy.elements().removeClass('type-hidden');
      legendEl.querySelectorAll('.legend-item').forEach(el => {
        el.classList.remove('active', 'inactive');
      });
      return;
    }

    activeRelFilter = relType;

    // Classify edges and nodes
    const visibleEdges  = cy.edges(`[rel_type="${relType}"]`);
    const visibleNodes  = visibleEdges.connectedNodes();

    cy.edges().addClass('type-hidden');
    cy.nodes().addClass('type-hidden');
    visibleEdges.removeClass('type-hidden');
    visibleNodes.removeClass('type-hidden');

    // Update legend styles
    legendEl.querySelectorAll('.legend-item').forEach(el => {
      if (el.dataset.rel === relType) {
        el.classList.add('active');
        el.classList.remove('inactive');
      } else {
        el.classList.add('inactive');
        el.classList.remove('active');
      }
    });
  }

  // ── Fetch graph data and render ──
  async function loadGraph() {
    const universe = universeSelect.value;
    if (!universe) return;
    currentUniverse = universe;
    const maxNodes = parseInt(maxNodesSlider.value);

    loadingEl.classList.add('visible');
    clearHighlight();
    statusEl.textContent = '';

    try {
      const res  = await fetch(`/api/graph?universe=${universe}&max_nodes=${maxNodes}`);
      const data = await res.json();

      if (!data.nodes.length) {
        statusEl.textContent = `No data for "${universe}" — run: py flows/ingest.py ${universe}`;
        return;
      }

      renderGraph(data.nodes, data.edges);
      const edgeNote = data.edges.length === 0 ? ' · no relationships found, try re-ingesting' : '';
      statusEl.textContent = `${data.nodes.length} nodes · ${data.edges.length} edges${edgeNote}`;
    } catch (err) {
      statusEl.textContent = `Error: ${err.message}`;
    } finally {
      loadingEl.classList.remove('visible');
    }
  }

  // ── Cytoscape render ──
  function renderGraph(nodes, edges) {
    document.getElementById('empty-state').classList.add('hidden');
    activeRelFilter       = null;
    activeCommunityFilter = null;
    if (cy) cy.destroy();

    // Ensure all nodes have a community color (fallback for old cache without analytics)
    nodes.forEach(n => { if (!n.data.communityColor) n.data.communityColor = '#5c3d10'; });

    // Per-relationship-type edge colour rules
    const edgeStyleRules = Object.entries(EDGE_COLORS).map(([type, color]) => ({
      selector: `edge[rel_type="${type}"]`,
      style: { 'line-color': color, 'target-arrow-color': color },
    }));

    cy = cytoscape({
      container: document.getElementById('cy'),
      elements:  [...nodes, ...edges],

      style: [
        {
          selector: 'node',
          style: {
            'background-color':        'data(communityColor)',
            'border-color':            '#c9a84c',
            'border-width':            1.5,
            'width':                   'data(size)',
            'height':                  'data(size)',
            'label':                   'data(label)',
            'color':                   '#f0dfa0',
            'font-size':               13,
            'font-family':             'Lora, Georgia, serif',
            'text-valign':             'bottom',
            'text-halign':             'center',
            'text-margin-y':           4,
            'text-wrap':               'none',
            'min-zoomed-font-size':    10,
            'text-background-color':   '#080502',
            'text-background-opacity': 0.85,
            'text-background-padding': '4px',
          },
        },
        {
          selector: 'node.highlighted',
          style: {
            'background-color':     '#c9a84c',
            'border-color':         '#fff8e0',
            'border-width':         3,
            'min-zoomed-font-size': 0,
          },
        },
        {
          selector: 'node.dimmed',
          style: { 'opacity': 0.15 },
        },
        {
          selector: 'edge',
          style: {
            'line-color':         '#4a3010',
            'target-arrow-color': '#4a3010',
            'target-arrow-shape': 'triangle',
            'curve-style':        'bezier',
            'width':              1.5,
            'arrow-scale':        0.8,
            'opacity':            0.75,
          },
        },
        {
          selector: 'edge.highlighted',
          style: { 'opacity': 1, 'width': 2.5 },
        },
        {
          selector: 'edge.dimmed',
          style: { 'opacity': 0.04 },
        },
        {
          selector: 'edge.type-hidden',
          style: { 'opacity': 0.04 },
        },
        {
          selector: 'node.type-hidden',
          style: { 'opacity': 0.06 },
        },
        {
          selector: 'node.path-node',
          style: {
            'background-color':     '#c9a84c',
            'border-color':         '#fff8e0',
            'border-width':         3,
            'min-zoomed-font-size': 0,
          },
        },
        {
          selector: 'edge.path-edge',
          style: {
            'line-color':         '#c9a84c',
            'target-arrow-color': '#c9a84c',
            'width':              3,
            'opacity':            1,
          },
        },
        ...edgeStyleRules,
      ],

      layout: {
        name:              'cose',
        animate:           true,
        animationDuration: 1000,
        nodeRepulsion:     950000,
        nodeOverlap:       40,
        idealEdgeLength:   240,
        edgeElasticity:    80,
        nestingFactor:     1,
        gravity:           3,
        numIter:           nodes.length > 150 ? 2000 : 3500,
        initialTemp:       800,
        coolingFactor:     0.95,
        minTemp:           1.0,
        boundingBox:       { x1: 0, y1: 0,
                             w: document.getElementById('cy').clientWidth,
                             h: document.getElementById('cy').clientHeight },
        fit:               true,
        padding:           80,
        randomize:         true,
      },
    });

    // ── Node click: highlight neighbourhood + fetch bio ──
    cy.on('tap', 'node', function(e) {
      const node      = e.target;
      const connected = node.connectedEdges();
      const neighbours= connected.connectedNodes();

      cy.elements().addClass('dimmed');
      node.removeClass('dimmed').addClass('highlighted');
      neighbours.removeClass('dimmed');
      connected.removeClass('dimmed').addClass('highlighted');

      const label = node.data('label');
      infoTitleEl.textContent = label;

      const rows = connected.map(edge => {
        const rel   = edge.data('rel_type') || '';
        const other = edge.source().id() === node.id()
          ? edge.target().data('label')
          : edge.source().data('label');
        const dir   = edge.source().id() === node.id() ? '→' : '←';
        const color = EDGE_COLORS[rel] || '#888';
        return `<div class="rel-row">
          <span class="rel-badge" style="background:${color}22;border:1px solid ${color};color:${color}">
            ${rel.replace(/_/g, ' ')}
          </span>
          <span>${dir} <strong>${other}</strong></span>
        </div>`;
      }).join('');

      const rank       = node.data('rank');
      const total      = node.data('total');
      const community  = node.data('community');
      const commColor  = node.data('communityColor') || '#888';

      const statsHtml = `
        <div style="margin-bottom:8px;font-size:0.82rem;color:#7a6030;display:flex;gap:12px;flex-wrap:wrap">
          ${rank != null ? `<span>Rank <strong style="color:#c9a84c">#${rank}</strong> of ${total}</span>` : ''}
          ${community != null ? `<span style="color:${commColor}">◆ ${node.data('communityName') || 'Group ' + (community + 1)}</span>` : ''}
          <span>Connections <strong style="color:#e8d5a3">${node.data('degree')}</strong></span>
        </div>
      `;

      const connectionsHtml = `
        ${statsHtml}
        ${rows || '<em style="color:#555">No relationships shown</em>'}
        <div style="margin-top:14px;padding-top:12px;border-top:1px solid #3d2e14">
          <div style="font-size:0.8rem;color:#7a6030;margin-bottom:6px">Find path to:</div>
          <div style="display:flex;gap:6px">
            <input id="path-target-input" type="text" placeholder="Character name…"
                   style="flex:1;background:#1e1508;color:#e8d5a3;border:1px solid #3d2e14;
                          border-radius:3px;padding:3px 8px;font-family:inherit;font-size:0.85rem">
            <button id="path-find-btn"
                    style="background:#1e1508;color:#c9a84c;border:1px solid #5a4020;
                           border-radius:3px;padding:3px 12px;font-family:inherit;
                           font-size:0.85rem;cursor:pointer;white-space:nowrap">Find</button>
          </div>
          <div id="path-result" style="margin-top:8px;font-size:0.82rem;line-height:1.6"></div>
        </div>
      `;

      // Show panel immediately with a bio placeholder
      infoBodyEl.innerHTML = `
        <div id="bio-section" style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #3d2e14">
          <em style="color:#3d2e14;font-size:0.85rem">Loading…</em>
        </div>
        ${connectionsHtml}
      `;

      // Wire up path finder
      const pathInput  = document.getElementById('path-target-input');
      const pathBtn    = document.getElementById('path-find-btn');
      const pathResult = document.getElementById('path-result');

      async function findPath() {
        const tgt = pathInput.value.trim();
        if (!tgt || !currentUniverse) return;
        pathResult.innerHTML = '<em style="color:#7a6030">Searching…</em>';
        cy.elements().removeClass('path-node path-edge');

        try {
          const res  = await fetch(`/api/path?universe=${encodeURIComponent(currentUniverse)}&source=${encodeURIComponent(label)}&target=${encodeURIComponent(tgt)}`);
          const data = await res.json();

          if (data.error || !data.steps || !data.steps.length) {
            pathResult.innerHTML = `<span style="color:#d95f5f">${data.error || 'No path found'}</span>`;
            return;
          }

          // Highlight path
          const pathSet = new Set(data.path);
          cy.elements().addClass('dimmed');
          cy.nodes().filter(n => pathSet.has(n.id())).removeClass('dimmed').addClass('path-node');
          for (let i = 0; i < data.path.length - 1; i++) {
            const a = data.path[i], b = data.path[i + 1];
            cy.edges().filter(e =>
              (e.source().id() === a && e.target().id() === b) ||
              (e.source().id() === b && e.target().id() === a)
            ).removeClass('dimmed').addClass('path-edge');
          }

          const stepsHtml = data.steps.map(s => {
            const rel   = s.rel.replace(/_/g, ' ');
            const color = EDGE_COLORS[s.rel] || '#888';
            return `<div style="display:flex;align-items:center;gap:5px;margin:3px 0;flex-wrap:wrap">
              <strong style="color:#e8d5a3">${s.from}</strong>
              <span style="color:${color};font-size:0.75rem">→ ${rel} →</span>
              <strong style="color:#e8d5a3">${s.to}</strong>
            </div>`;
          }).join('');
          pathResult.innerHTML = `<div style="color:#7a6030;margin-bottom:4px">${data.path.length - 1} hop${data.path.length > 2 ? 's' : ''}:</div>${stepsHtml}`;
        } catch (err) {
          pathResult.innerHTML = `<span style="color:#d95f5f">Error: ${err.message}</span>`;
        }
      }

      pathBtn.addEventListener('click', findPath);
      pathInput.addEventListener('keydown', e => { if (e.key === 'Enter') findPath(); });
      infoEl.classList.add('visible');

      // Fetch bio asynchronously
      if (currentUniverse) {
        fetch(`/api/character?universe=${encodeURIComponent(currentUniverse)}&name=${encodeURIComponent(label)}`)
          .then(r => r.json())
          .then(data => {
            const bioEl = document.getElementById('bio-section');
            if (!bioEl) return;
            if (data.summary) {
              bioEl.innerHTML = `<p style="font-size:0.85rem;line-height:1.6;color:#c8b47a;font-style:italic">${data.summary}</p>`;
            } else {
              bioEl.remove();
            }
          })
          .catch(() => {
            const bioEl = document.getElementById('bio-section');
            if (bioEl) bioEl.remove();
          });
      }
    });

    // ── Edge click ──
    cy.on('tap', 'edge', function(e) {
      const edge  = e.target;
      const rel   = edge.data('rel_type') || '';
      const color = EDGE_COLORS[rel] || '#888';

      cy.elements().addClass('dimmed');
      edge.removeClass('dimmed').addClass('highlighted');
      edge.source().removeClass('dimmed').addClass('highlighted');
      edge.target().removeClass('dimmed').addClass('highlighted');

      infoTitleEl.textContent = rel.replace(/_/g, ' ');
      infoBodyEl.innerHTML = `
        <div style="margin-bottom:8px">
          <span class="rel-badge" style="background:${color}22;border:1px solid ${color};color:${color}">
            ${rel.replace(/_/g, ' ')}
          </span>
        </div>
        <div><strong>${edge.source().data('label')}</strong></div>
        <div style="margin:4px 0;color:#666">↓</div>
        <div><strong>${edge.target().data('label')}</strong></div>
      `;
      infoEl.classList.add('visible');
    });

    // ── Tap on background: clear ──
    cy.on('tap', function(e) {
      if (e.target === cy) clearHighlight();
    });

    buildLegend(nodes, edges);
  }

  // ── Search: highlight matching nodes ──
  searchInput.addEventListener('input', function() {
    if (!cy) return;
    const q = this.value.trim().toLowerCase();
    if (!q) { clearHighlight(); return; }

    const matched = cy.nodes().filter(n =>
      n.data('label').toLowerCase().includes(q)
    );
    if (!matched.length) return;

    cy.elements().addClass('dimmed');
    matched.removeClass('dimmed').addClass('highlighted');
    matched.connectedEdges().removeClass('dimmed').addClass('highlighted');
    matched.neighborhood().nodes().removeClass('dimmed');

    if (matched.length === 1) {
      cy.animate({ center: { eles: matched }, zoom: 1.8 }, { duration: 350 });
    } else {
      cy.fit(matched, 60);
    }
  });

  universeSelect.addEventListener('change', loadGraph);
  loadBtn.addEventListener('click', loadGraph);

  loadUniverses();
</script>
</body>
</html>

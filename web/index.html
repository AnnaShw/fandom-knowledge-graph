<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fandom Knowledge Graph</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.29.0/cytoscape.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Lora', Georgia, serif;
      background: #0e0b07;
      color: #e8d5a3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Controls bar ── */
    #controls {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 9px 20px;
      background: #160f05;
      border-bottom: 1px solid #3d2e14;
      flex-shrink: 0;
    }

    #controls h1 {
      font-size: 1.2rem;
      font-weight: 600;
      font-style: italic;
      color: #c9a84c;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    /* thin ornamental divider after the title */
    #controls h1::after {
      content: '·';
      margin-left: 14px;
      color: #3d2e14;
      font-style: normal;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      font-size: 0.85rem;
      color: #7a6030;
      white-space: nowrap;
    }

    select, input[type="text"] {
      background: #1e1508;
      color: #e8d5a3;
      border: 1px solid #3d2e14;
      border-radius: 3px;
      padding: 4px 10px;
      font-size: 0.9rem;
      font-family: inherit;
      cursor: pointer;
    }

    select:focus, input[type="text"]:focus { outline: 1px solid #c9a84c; }

    input[type="range"] {
      width: 110px;
      accent-color: #c9a84c;
      cursor: pointer;
    }

    #node-count-label {
      font-size: 0.85rem;
      color: #7a6030;
      min-width: 52px;
    }

    #search-input { width: 160px; }
    #search-input::placeholder { color: #3d2e14; }

    button#load-btn {
      background: #1e1508;
      color: #c9a84c;
      border: 1px solid #5a4020;
      border-radius: 3px;
      padding: 4px 18px;
      font-size: 0.9rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.5px;
    }
    button#load-btn:hover  { border-color: #c9a84c; background: #251a08; }
    button#load-btn:active { background: #160f05; }

    #status {
      margin-left: auto;
      font-size: 0.8rem;
      color: #5a4020;
      white-space: nowrap;
      font-style: italic;
    }

    /* ── Main canvas area ── */
    #main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #cy { width: 100%; height: 100%; background: #080502; }

    /* ── Loading overlay ── */
    #loading {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(8, 5, 2, 0.86);
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
    }
    #loading.visible { display: flex; }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #3d2e14;
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading span { font-size: 1rem; color: #7a6030; font-style: italic; }

    /* ── Info panel ── */
    #info {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 255px;
      max-height: calc(100% - 28px);
      background: #160f05;
      border: 1px solid #3d2e14;
      border-radius: 4px;
      padding: 14px 16px;
      font-size: 0.9rem;
      line-height: 1.65;
      display: none;
      z-index: 10;
      overflow-y: auto;
    }
    #info.visible { display: block; }

    #info-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #3d2e14;
    }

    #info h2 {
      font-size: 1.05rem;
      color: #c9a84c;
      line-height: 1.3;
      font-style: italic;
    }

    #info-close {
      cursor: pointer;
      color: #3d2e14;
      font-size: 1rem;
      line-height: 1;
      flex-shrink: 0;
      margin-left: 8px;
    }
    #info-close:hover { color: #c9a84c; }

    .rel-badge {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 2px;
      font-size: 0.78rem;
      font-weight: 600;
      font-style: normal;
    }

    .rel-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 4px 0;
      flex-wrap: wrap;
    }

    /* ── Empty state ── */
    #empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      pointer-events: none;
    }
    #empty-state p {
      font-size: 1.05rem;
      font-style: italic;
      color: #3d2e14;
      border: 1px dashed #3d2e14;
      padding: 18px 32px;
      border-radius: 4px;
    }
    #empty-state.hidden { display: none; }

    /* ── Legend ── */
    #legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: rgba(22, 15, 5, 0.95);
      border: 1px solid #3d2e14;
      border-radius: 4px;
      padding: 7px 12px;
      font-size: 0.78rem;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      max-width: 620px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 3px 7px;
      border-radius: 3px;
      border: 1px solid transparent;
      transition: background 0.15s, opacity 0.15s, border-color 0.15s;
      user-select: none;
    }
    .legend-item:hover { background: rgba(201,168,76,0.08); }
    .legend-item.active {
      background: rgba(201,168,76,0.12);
      border-color: var(--rel-color);
    }
    .legend-item.inactive { opacity: 0.28; }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div id="controls">
  <h1>Fandom Knowledge Graph</h1>

  <div class="control-group">
    <label for="universe-select">Universe</label>
    <select id="universe-select"></select>
  </div>

  <div class="control-group">
    <label for="max-nodes">Max nodes</label>
    <input type="range" id="max-nodes" min="20" max="500" value="200" step="10">
    <span id="node-count-label">200</span>
  </div>

  <div class="control-group">
    <input type="text" id="search-input" placeholder="Search character…">
  </div>

  <button id="load-btn">Load</button>

  <span id="status"></span>
</div>

<div id="main">
  <div id="empty-state">
    <p>Select a universe from the dropdown above to visualize the graph.</p>
  </div>
  <div id="cy"></div>

  <div id="loading">
    <div class="spinner"></div>
    <span>Building graph…</span>
  </div>

  <div id="info">
    <div id="info-header">
      <h2 id="info-title"></h2>
      <span id="info-close">✕</span>
    </div>
    <div id="info-body"></div>
  </div>

  <div id="legend"></div>
</div>

<script>
  const EDGE_COLORS = {
    FAMILY_OF:          '#e67e22',
    PARENT_OF:          '#e74c3c',
    SIBLING_OF:         '#f39c12',
    ROMANTIC_WITH:      '#e91e63',
    MARRIED_TO:         '#e91e63',
    FRIEND_OF:          '#2ecc71',
    ENEMY_OF:           '#9b59b6',
    MEMBER_OF:          '#3498db',
    BELONGS_TO_SPECIES: '#1abc9c',
    BELONGS_TO_RACE:    '#1abc9c',
    FROM_HOMEWORLD:     '#00bcd4',
  };

  const universeSelect = document.getElementById('universe-select');
  const maxNodesSlider = document.getElementById('max-nodes');
  const nodeCountLabel = document.getElementById('node-count-label');
  const searchInput    = document.getElementById('search-input');
  const loadBtn        = document.getElementById('load-btn');
  const statusEl       = document.getElementById('status');
  const loadingEl      = document.getElementById('loading');
  const infoEl         = document.getElementById('info');
  const infoTitleEl    = document.getElementById('info-title');
  const infoBodyEl     = document.getElementById('info-body');
  const legendEl       = document.getElementById('legend');

  let cy = null;

  maxNodesSlider.addEventListener('input', () => {
    nodeCountLabel.textContent = maxNodesSlider.value;
  });

  document.getElementById('info-close').addEventListener('click', clearHighlight);

  function clearHighlight() {
    infoEl.classList.remove('visible');
    if (cy) cy.elements().removeClass('highlighted dimmed');
  }

  // ── Populate universe dropdown ──
  async function loadUniverses() {
    const res  = await fetch('/api/universes');
    const list = await res.json();

    // placeholder option
    const placeholder = document.createElement('option');
    placeholder.value    = '';
    placeholder.disabled = true;
    placeholder.selected = true;
    placeholder.textContent = 'Choose a universe…';
    universeSelect.appendChild(placeholder);

    list.forEach(u => {
      const opt = document.createElement('option');
      opt.value       = u.id;
      opt.textContent = u.name;
      universeSelect.appendChild(opt);
    });
  }

  // ── Build edge-type legend from what's actually present ──
  let activeRelFilter = null;

  function buildLegend(edges) {
    const seen = new Set();
    legendEl.innerHTML = '';
    activeRelFilter = null;

    edges.forEach(e => {
      const t = e.data.rel_type;
      if (!t || seen.has(t)) return;
      seen.add(t);
      const color = EDGE_COLORS[t] || '#888';
      const label = t.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const item  = document.createElement('div');
      item.className   = 'legend-item';
      item.dataset.rel = t;
      item.style.setProperty('--rel-color', color);
      item.innerHTML   = `<div class="legend-dot" style="background:${color}"></div><span>${label}</span>`;
      item.addEventListener('click', () => toggleRelFilter(t));
      legendEl.appendChild(item);
    });
  }

  function toggleRelFilter(relType) {
    if (!cy) return;

    if (activeRelFilter === relType) {
      // Clear filter
      activeRelFilter = null;
      cy.elements().removeClass('type-hidden');
      legendEl.querySelectorAll('.legend-item').forEach(el => {
        el.classList.remove('active', 'inactive');
      });
      return;
    }

    activeRelFilter = relType;

    // Classify edges and nodes
    const visibleEdges  = cy.edges(`[rel_type="${relType}"]`);
    const visibleNodes  = visibleEdges.connectedNodes();

    cy.edges().addClass('type-hidden');
    cy.nodes().addClass('type-hidden');
    visibleEdges.removeClass('type-hidden');
    visibleNodes.removeClass('type-hidden');

    // Update legend styles
    legendEl.querySelectorAll('.legend-item').forEach(el => {
      if (el.dataset.rel === relType) {
        el.classList.add('active');
        el.classList.remove('inactive');
      } else {
        el.classList.add('inactive');
        el.classList.remove('active');
      }
    });
  }

  // ── Fetch graph data and render ──
  async function loadGraph() {
    const universe = universeSelect.value;
    if (!universe) return;
    const maxNodes = parseInt(maxNodesSlider.value);

    loadingEl.classList.add('visible');
    clearHighlight();
    statusEl.textContent = '';

    try {
      const res  = await fetch(`/api/graph?universe=${universe}&max_nodes=${maxNodes}`);
      const data = await res.json();

      if (!data.nodes.length) {
        statusEl.textContent = `No data for "${universe}" — run: py flows/ingest.py ${universe}`;
        return;
      }

      renderGraph(data.nodes, data.edges);
      const edgeNote = data.edges.length === 0 ? ' · no relationships found, try re-ingesting' : '';
      statusEl.textContent = `${data.nodes.length} nodes · ${data.edges.length} edges${edgeNote}`;
    } catch (err) {
      statusEl.textContent = `Error: ${err.message}`;
    } finally {
      loadingEl.classList.remove('visible');
    }
  }

  // ── Cytoscape render ──
  function renderGraph(nodes, edges) {
    document.getElementById('empty-state').classList.add('hidden');
    activeRelFilter = null;
    if (cy) cy.destroy();

    // Per-relationship-type edge colour rules
    const edgeStyleRules = Object.entries(EDGE_COLORS).map(([type, color]) => ({
      selector: `edge[rel_type="${type}"]`,
      style: { 'line-color': color, 'target-arrow-color': color },
    }));

    cy = cytoscape({
      container: document.getElementById('cy'),
      elements:  [...nodes, ...edges],

      style: [
        {
          selector: 'node',
          style: {
            'background-color':     '#5c3d10',
            'border-color':         '#c9a84c',
            'border-width':         1.5,
            'width':                'data(size)',
            'height':               'data(size)',
            'label':                'data(label)',
            'color':                '#f0dfa0',
            'font-size':            13,
            'font-family':          'Lora, Georgia, serif',
            'text-valign':          'bottom',
            'text-halign':          'center',
            'text-margin-y':        4,
            'text-wrap':            'none',
            'min-zoomed-font-size': 16,
          },
        },
        {
          selector: 'node.highlighted',
          style: {
            'background-color': '#c9a84c',
            'border-color':     '#fff8e0',
            'border-width':     3,
          },
        },
        {
          selector: 'node.dimmed',
          style: { 'opacity': 0.15 },
        },
        {
          selector: 'edge',
          style: {
            'line-color':         '#4a3010',
            'target-arrow-color': '#4a3010',
            'target-arrow-shape': 'triangle',
            'curve-style':        'bezier',
            'width':              1.5,
            'arrow-scale':        0.8,
            'opacity':            0.75,
          },
        },
        {
          selector: 'edge.highlighted',
          style: { 'opacity': 1, 'width': 2.5 },
        },
        {
          selector: 'edge.dimmed',
          style: { 'opacity': 0.04 },
        },
        {
          selector: 'edge.type-hidden',
          style: { 'opacity': 0.04 },
        },
        {
          selector: 'node.type-hidden',
          style: { 'opacity': 0.06 },
        },
        ...edgeStyleRules,
      ],

      layout: {
        name:              'cose',
        animate:           true,
        animationDuration: 800,
        nodeRepulsion:     800000,
        nodeOverlap:       20,
        idealEdgeLength:   280,
        edgeElasticity:    100,
        nestingFactor:     5,
        gravity:           8,
        numIter:           nodes.length > 150 ? 1500 : 3000,
        initialTemp:       500,
        coolingFactor:     0.95,
        minTemp:           1.0,
      },
    });

    // ── Node click: highlight neighbourhood ──
    cy.on('tap', 'node', function(e) {
      const node      = e.target;
      const connected = node.connectedEdges();
      const neighbours= connected.connectedNodes();

      cy.elements().addClass('dimmed');
      node.removeClass('dimmed').addClass('highlighted');
      neighbours.removeClass('dimmed');
      connected.removeClass('dimmed').addClass('highlighted');

      infoTitleEl.textContent = node.data('label');

      const rows = connected.map(edge => {
        const rel   = edge.data('rel_type') || '';
        const other = edge.source().id() === node.id()
          ? edge.target().data('label')
          : edge.source().data('label');
        const dir   = edge.source().id() === node.id() ? '→' : '←';
        const color = EDGE_COLORS[rel] || '#888';
        return `<div class="rel-row">
          <span class="rel-badge" style="background:${color}22;border:1px solid ${color};color:${color}">
            ${rel.replace(/_/g, ' ')}
          </span>
          <span>${dir} <strong>${other}</strong></span>
        </div>`;
      }).join('');

      infoBodyEl.innerHTML = `
        <div style="margin-bottom:8px;color:#aaa">Connections: <strong style="color:#e0e0e0">${node.data('degree')}</strong></div>
        ${rows || '<em style="color:#555">No relationships shown</em>'}
      `;
      infoEl.classList.add('visible');
    });

    // ── Edge click ──
    cy.on('tap', 'edge', function(e) {
      const edge  = e.target;
      const rel   = edge.data('rel_type') || '';
      const color = EDGE_COLORS[rel] || '#888';

      cy.elements().addClass('dimmed');
      edge.removeClass('dimmed').addClass('highlighted');
      edge.source().removeClass('dimmed').addClass('highlighted');
      edge.target().removeClass('dimmed').addClass('highlighted');

      infoTitleEl.textContent = rel.replace(/_/g, ' ');
      infoBodyEl.innerHTML = `
        <div style="margin-bottom:8px">
          <span class="rel-badge" style="background:${color}22;border:1px solid ${color};color:${color}">
            ${rel.replace(/_/g, ' ')}
          </span>
        </div>
        <div><strong>${edge.source().data('label')}</strong></div>
        <div style="margin:4px 0;color:#666">↓</div>
        <div><strong>${edge.target().data('label')}</strong></div>
      `;
      infoEl.classList.add('visible');
    });

    // ── Tap on background: clear ──
    cy.on('tap', function(e) {
      if (e.target === cy) clearHighlight();
    });

    buildLegend(edges);
  }

  // ── Search: highlight matching nodes ──
  searchInput.addEventListener('input', function() {
    if (!cy) return;
    const q = this.value.trim().toLowerCase();
    if (!q) { clearHighlight(); return; }

    const matched = cy.nodes().filter(n =>
      n.data('label').toLowerCase().includes(q)
    );
    if (!matched.length) return;

    cy.elements().addClass('dimmed');
    matched.removeClass('dimmed').addClass('highlighted');
    matched.connectedEdges().removeClass('dimmed').addClass('highlighted');
    matched.neighborhood().nodes().removeClass('dimmed');

    if (matched.length === 1) {
      cy.animate({ center: { eles: matched }, zoom: 1.8 }, { duration: 350 });
    } else {
      cy.fit(matched, 60);
    }
  });

  universeSelect.addEventListener('change', loadGraph);
  loadBtn.addEventListener('click', loadGraph);

  loadUniverses();
</script>
</body>
</html>
